steps:
  # Install dependencies (Vite 7 / rolldown require Node 20.19+ or 22.12+;
  # gcr.io/cloud-builders/npm ships an old Node 19, so use an official Node image instead)
  - name: "node:22"
    id: install
    entrypoint: npm
    args: ["ci"]

  # Build the React app (tsc -b && vite build) -> outputs to dist/
  - name: "node:22"
    id: build
    entrypoint: npm
    args: ["run", "build"]
    waitFor: ["install"]

  # Deploy the built app to the App Engine "ip-react" service
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-service
    entrypoint: gcloud
    args:
      - "app"
      - "deploy"
      - "app.yaml"
      - "--project=$PROJECT_ID"
      - "--quiet"
    waitFor: ["build"]

  # Update dispatch routing rules
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-dispatch
    entrypoint: gcloud
    args:
      - "app"
      - "deploy"
      - "dispatch.yaml"
      - "--project=$PROJECT_ID"
      - "--quiet"
    waitFor: ["deploy-service"]

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
