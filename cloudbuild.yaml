  #   dir: projects/wiq-si-portal
  #   entrypoint: bash
  #   args:
  #     - "-c"
  #     - |
  #       if [ -f "configs/env-config-$PROJECT_ID.json.enc" ]; then
  #         gcloud kms decrypt \
  #           --ciphertext-file="configs/env-config-$PROJECT_ID.json.enc" \
  #           --plaintext-file=frontend/env-config.json \
  #           --location=australia-southeast1 \
  #           --keyring="$PROJECT_ID" \
  #           --key=si-cicd
  #       else
  #         echo "No configs/env-config-$PROJECT_ID.json.enc found, using default theme config"
  #       fi

  - name: "node:22"
    id: install
    dir: projects/wiq-si-portal/frontend
    entrypoint: npm
    args: ["ci"]
    waitFor: ["-"]

  - name: "node:22"
    id: build
    dir: projects/wiq-si-portal/frontend
    entrypoint: npm
    args: ["run", "build"]
    waitFor: ["install"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-service
    dir: projects/wiq-si-portal/frontend
    entrypoint: gcloud
    args:
      - "app"
      - "deploy"
      - "app.yaml"
      - "--project=$PROJECT_ID"
      - "--quiet"
    waitFor: ["build"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-dispatch
    dir: projects/wiq-si-portal
    entrypoint: gcloud
    args:
      - "app"
      - "deploy"
      - "dispatch.yaml"
      - "--project=$PROJECT_ID"
      - "--quiet"
    waitFor: ["deploy-service"]

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
